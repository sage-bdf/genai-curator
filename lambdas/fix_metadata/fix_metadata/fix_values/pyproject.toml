[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metadata-fix-values"
version = "0.1.0"
description = "Metadata correction pipeline package"
requires-python = ">=3.11"
dependencies = [
    "loguru>=0.7.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "rapidfuzz>=3.0.0",
    "langchain>=0.0.300",
    "langchain-aws>=0.0.1",
    "PyYAML>=6.0.0",
    "langgraph",
    "langfuse<3.0.0",
    "ijson>=3.0.0",
    "plotly"
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.0.0",
    "pandas-stubs>=2.0.0.230412",
    "types-PyYAML>=6.0.0",
    "scikit-learn-stubs>=0.1.0"
]
sentence-transformers = [
    "sentence-transformers>=2.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fix_values"]

[tool.hatch.build]
packages = ["src"]
